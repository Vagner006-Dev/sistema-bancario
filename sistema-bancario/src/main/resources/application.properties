spring.application.name=sistema-bancario
spring.datasource.url=jdbc:mysql://localhost:3306/banco?useSSL=false&serverTimezone=Africa/Maputo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.expiracao-segundos=${JWT_EXPIRACAO_SEGUNDOS:3600}

admin.email=${ADMIN_EMAIL:admin@banco.mz}
admin.senha=${ADMIN_SENHA:Admin@123}