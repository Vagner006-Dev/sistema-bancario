spring.application.name=transaccoes
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/transaccoes_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TEM DE SER IGUAL à do serviço de Contas: é o que permite validar os mesmos tokens
jwt.secret=${JWT_SECRET}

# Onde está o serviço de Contas
contas.url=${CONTAS_URL:http://localhost:8080}

# Nome do banco do grupo (aparece nos comprovativos)
banco.nome=${BANCO_NOME:Premium Bank}